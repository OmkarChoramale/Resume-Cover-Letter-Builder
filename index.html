<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EleganceAI Resume Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;700&family=Roboto+Slab:wght@400;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #0a031a;
        --bg-secondary: #1a0a3a;
        --primary: #8e2de2; 
        --accent: #00d4ff;  
        --text-primary: #e0e0ff;
        --text-secondary: #a0a0c0;
        --border-color: rgba(142, 45, 226, 0.3);
      }
      
      /* Custom scrollbar for a more polished look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 3, 26, 0.5);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a04dff;
      }
      
      body {
        background-color: var(--bg-primary);
        background-image: radial-gradient(circle at 80% 20%, rgba(142, 45, 226, 0.4), transparent 40%),
                          radial-gradient(circle at 20% 90%, rgba(0, 212, 255, 0.3), transparent 40%);
        background-attachment: fixed;
        color: var(--text-primary);
        overflow: hidden; /* Hide body scrollbars to let internal containers scroll */
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
      }
      
      #root {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      
      @media print {
        body, #root {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
          background: #ffffff !important;
          color: #000000 !important;
          overflow: visible;
          height: auto;
          width: auto;
          background-image: none;
        }
        .no-print {
          display: none !important;
        }
        .print-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
          box-shadow: none !important;
        }
        @page {
          size: A4;
          margin: 0;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom": "https://esm.sh/react-dom@18.2.0",

    "framer-motion": "https://esm.sh/framer-motion@11.1.7",
    "react-rnd": "https://esm.sh/react-rnd@10.4.10",
    "immer": "https://esm.sh/immer@10.1.1",
    "lodash-es": "https://esm.sh/lodash-es@4.17.21",
    "@google/genai": "https://esm.sh/@google/genai@0.14.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lodash": "https://aistudiocdn.com/lodash@^4.17.21"
  }
}
</script>
</head>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
